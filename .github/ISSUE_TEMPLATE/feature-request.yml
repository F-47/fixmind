name: Feature request
description: Suggest an improvement to the local Fixmind product.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: checkboxes
    id: local-first
    attributes:
      label: Product boundary
      options:
        - label: This proposal keeps the local product useful without a hosted account.
          required: true
