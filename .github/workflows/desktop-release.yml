name: Desktop release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows desktop release
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: "1"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.version -ne $tagVersion) {
            throw "Tag $tagVersion does not match desktop version $($config.version)."
          }
          "DESKTOP_VERSION=$($config.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: npm ci

      - name: Run release validation
        run: |
          npm run lint
          npm test
          npm run prepare:sidecar -w @fixmind/desktop
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build desktop resources
        working-directory: apps/desktop
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) {
            throw "Configure TAURI_SIGNING_PRIVATE_KEY and TAURI_UPDATER_PUBLIC_KEY before tagging a release."
          }
          $releaseConfig = @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{
              pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
              endpoints = @("https://github.com/F-47/fixmind/releases/latest/download/latest.json")
              windows = @{ installMode = "passive" }
            }}
          } | ConvertTo-Json -Depth 8
          Set-Content -Path src-tauri/tauri.release.conf.json -Value $releaseConfig -Encoding utf8
          npm run prepare:sidecar
          npm run frontend:build
          cargo build --release --manifest-path src-tauri/Cargo.toml
          npx tauri build --no-bundle --ci --config src-tauri/tauri.release.conf.json

      - name: Bundle NSIS installer and signed updater artifact
        working-directory: apps/desktop
        run: npx tauri bundle --bundles nsis --ci --config src-tauri/tauri.release.conf.json

      - name: Run installed-package smoke test
        working-directory: apps/desktop
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-installed-app.ps1 -InstallerPath "src-tauri/target/release/bundle/nsis/Fixmind_${env:DESKTOP_VERSION}_x64-setup.exe"

      - name: Generate checksums
        shell: pwsh
        run: |
          $installer = "apps/desktop/src-tauri/target/release/bundle/nsis/Fixmind_${env:DESKTOP_VERSION}_x64-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Generate updater metadata
        shell: pwsh
        run: |
          $bundleDirectory = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $updaterBundle = (Get-ChildItem "$bundleDirectory/*.nsis.zip" | Select-Object -First 1)
          if (-not $updaterBundle) { throw "Updater bundle was not generated." }
          $signaturePath = "$($updaterBundle.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw "Updater signature was not generated." }
          $metadata = @{
            version = $env:DESKTOP_VERSION
            notes = "Fixmind desktop $env:GITHUB_REF_NAME"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{ "windows-x86_64" = @{
              signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
              url = "https://github.com/F-47/fixmind/releases/download/$env:GITHUB_REF_NAME/$($updaterBundle.Name)"
            }}
          } | ConvertTo-Json -Depth 8
          Set-Content -Path latest.json -Value $metadata -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "apps/desktop/src-tauri/target/release/bundle/nsis/Fixmind_${env:DESKTOP_VERSION}_x64-setup.exe"
          $bundle = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip" | Select-Object -First 1
          $signature = "$($bundle.FullName).sig"
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title "Fixmind $env:GITHUB_REF_NAME" --generate-notes $installer $bundle.FullName $signature latest.json SHA256SUMS.txt
